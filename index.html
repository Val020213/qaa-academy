<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QAA Academy</title>
    <script>
      // Apply the saved theme and language before the first paint
      // (see src/theme.ts and src/i18n.ts).
      try {
        if (localStorage.getItem("qaa-academy:locale") === "es") {
          document.documentElement.lang = "es"
        }
        document.documentElement.dataset.theme =
          localStorage.getItem("qaa-academy:theme") === "dark" ? "dark" : "light"
      } catch {
        document.documentElement.dataset.theme = "light"
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
